name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Reconstruir datos y probar PostgreSQL
        env:
          PYTHON: python
        run: bash scripts/demo.sh
      - name: Probar carga de muestra de escala completa
        run: |
          python src/generate_full_scale_data.py --start 2023-02-01 --as-of 2023-02-03T12:00:00 --output /tmp/portability_full_ci.csv.gz
          python -m src.load_full_scale_to_postgres --allow-partial-replace --input /tmp/portability_full_ci.csv.gz
          python src/generate_full_scale_data.py --start 2023-02-02 --as-of 2023-02-04T12:00:00 --output /tmp/portability_full_delta_ci.csv.gz
          python -m src.load_full_scale_to_postgres --mode sync --input /tmp/portability_full_delta_ci.csv.gz
          python -c 'from pathlib import Path; from src.load_full_scale_to_postgres import load; result = load(Path("/tmp/portability_full_delta_ci.csv.gz"), mode="sync"); assert result["inserted"] == result["updated"] == 0, result'
      - name: Verificar que la demo no altera archivos versionados
        run: git diff --exit-code
