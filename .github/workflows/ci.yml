name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Reconstruir datos y probar PostgreSQL
        env:
          PYTHON: python
        run: bash scripts/demo.sh
      - name: Verificar que la demo no altera archivos versionados
        run: git diff --exit-code
