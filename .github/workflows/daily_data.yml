name: Datos sintéticos diarios

on:
  schedule:
    - cron: '0 23 * * *' # 20:00 en Argentina (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-synthetic-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Generar hasta la hora actual de Argentina
        run: python src/generate_daily_data.py
      - name: Detectar cambios
        id: changes
        run: |
          if git diff --quiet -- data/sample/portability_cases_daily.csv data/sample/portability_cases_daily.meta.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar dependencias Python
        if: steps.changes.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt
      - name: Validar pipeline y PostgreSQL
        if: steps.changes.outputs.changed == 'true'
        env:
          PYTHON: python
        run: bash scripts/demo.sh
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Construir y probar portfolio
        if: steps.changes.outputs.changed == 'true'
        run: npm run build && npm run test:web
      - name: Publicar muestra versionada
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sample/portability_cases_daily.csv data/sample/portability_cases_daily.meta.json
          git commit -m 'Actualiza muestra sintética diaria'
          git push origin HEAD:main
      - name: Solicitar despliegue opcional en Vercel
        if: steps.changes.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [[ -n "$VERCEL_DEPLOY_HOOK_URL" ]]; then
            curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
