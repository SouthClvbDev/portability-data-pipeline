services:
  postgres:
    image: postgres:16
    container_name: portability-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portability_db}
      POSTGRES_USER: ${POSTGRES_USER:-data_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_password_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
